<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="社内AI勉強会「AIと、はたらく。」のイベント告知ページ" />
    <title>AIと、はたらく。｜社内AI勉強会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="event-page">
      <header class="site-header">
        <a class="brand" href="#" aria-label="AI Lab ホーム">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>AI LAB</span>
        </a>
        <p class="edition">INTERNAL SESSION <span>01</span></p>
      </header>

      <section class="hero" aria-label="AIと人が一緒にアイデアを生み出す様子を表したイラスト">
        <div class="hero-grid" aria-hidden="true"></div>
        <div class="orb orb-coral" aria-hidden="true"></div>
        <div class="orb orb-blue" aria-hidden="true"></div>
        <div class="spark spark-one" aria-hidden="true">✦</div>
        <div class="spark spark-two" aria-hidden="true">✦</div>

        <div class="hero-copy">
          <p class="eyebrow">LEARN · SHARE · CREATE</p>
          <p class="hero-word" aria-hidden="true">AI</p>
          <p class="hero-note">人とテクノロジーの、<br />ちょうどいい関係。</p>
        </div>

        <div class="bot" aria-hidden="true">
          <div class="antenna"><span></span></div>
          <div class="bot-head">
            <span class="bot-eye"></span><span class="bot-eye"></span>
            <span class="bot-mouth"></span>
          </div>
          <div class="bot-body"><span>AI</span></div>
          <div class="bot-arm bot-arm-left"></div>
          <div class="bot-arm bot-arm-right"></div>
        </div>

        <div class="speech-bubble" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="scroll-hint" aria-hidden="true">SCROLL <span></span></p>
      </section>

      <section class="event-info" aria-labelledby="event-title">
        <div class="intro">
          <p class="section-label"><span>01</span> AI STUDY SESSION</p>
          <h1 id="event-title">AIと、<br /><em>はたらく。</em></h1>
          <p class="description">まずは知ることから、はじめよう。<br />明日の仕事がちょっと楽しみになる、<br class="mobile-only" />社内AI勉強会です。</p>
        </div>

        <dl class="details">
          <div class="detail-row">
            <dt><span class="detail-icon" aria-hidden="true">◷</span>開催日時</dt>
            <dd><strong>2026. 09. 18</strong><span>FRI</span><small>16:00 — 17:30</small></dd>
          </div>
          <div class="detail-row">
            <dt><span class="detail-icon pin" aria-hidden="true">●</span>場所</dt>
            <dd><strong>5F LOUNGE</strong><small>オンライン同時配信あり</small></dd>
          </div>
        </dl>
      </section>
    </main>
